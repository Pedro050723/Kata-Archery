<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro Interno do Servidor (500)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            max-width: 500px;
            border: none;
            border-radius: 15px;
        }
        .error-icon {
            font-size: 4rem;
            color: #dc3545;
        }
    </style>
</head>
<body>

<div class="container text-center">
    <div class="card error-card shadow-sm mx-auto p-5">
        <div class="card-body">
            <div class="error-icon mb-4">⚠️</div>
            
            <h1 class="display-5 fw-bold text-dark mb-3">Erro no Servidor</h1>
            
            <p class="text-secondary mb-4">
                Desculpe, algo correu mal nos nossos bastidores. O nosso sistema encontrou um problema inesperado ao processar a sua requisição.
            </p>
            
            <p class="small text-muted mb-4">
                Código do erro: 500 (Internal Server Error)
            </p>

            <a href="/" class="btn btn-success fw-bold px-4 py-2 rounded-pill">
                Voltar para a Página Inicial
            </a>
        </div>
    </div>
</div>

</body>
</html>
