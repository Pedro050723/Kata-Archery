<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Kata Archery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">

<div class="container max-w-sm" style="max-width: 400px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4 text-center">
            <h3 class="mb-4 text-success fw-bold">🎯 Kata Archery</h3>
            
            {% if form.errors %}
                <div class="alert alert-danger py-2" role="alert">
                    <small>Usuário ou senha incorretos. Tente novamente.</small>
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold">Nome de Usuário</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label fw-bold">Senha</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-success w-100 fw-bold py-2">
                    Entrar
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
