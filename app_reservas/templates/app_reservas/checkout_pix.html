<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento da Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 max-w-md" style="max-width: 500px;">
    <div class="card shadow border-success">
        <div class="card-header bg-success text-white text-center">
            <h5 class="mb-0">Pague sua Reserva</h5>
        </div>
        <div class="card-body text-center">
            <h6 class="text-muted mb-4">Escaneie o QR Code ou use o Pix Copia e Cola</h6>
            
            <!-- Imagem do QR Code Base64 enviada pela API -->
            <img src="data:image/jpeg;base64,{{ qr_code_img }}" alt="QR Code Pix" class="img-fluid mb-3 rounded border" style="max-width: 250px;">
            
            <div class="mb-3">
                <label for="pixCode" class="form-label fw-bold">Pix Copia e Cola:</label>
                <textarea id="pixCode" class="form-control text-center" rows="3" readonly>{{ pix_copia_cola }}</textarea>
            </div>
            
            <!-- Script simples para copiar o código -->
            <button onclick="copiarPix()" class="btn btn-outline-success w-100 mb-4 fw-bold">
                📋 Copiar Código Pix
            </button>

            <div class="alert alert-warning py-2" role="alert">
                <small>Aguardando confirmação do banco... Você pode sair desta tela após pagar.</small>
            </div>

            <a href="{% url 'lista_horarios' %}" class="btn btn-secondary w-100">
                Voltar ao Início
            </a>
        </div>
    </div>
</div>

<script>
    function copiarPix() {
        var copyText = document.getElementById("pixCode");
        copyText.select();
        copyText.setSelectionRange(0, 99999); // Para mobile
        navigator.clipboard.writeText(copyText.value);
        alert("Código Pix copiado com sucesso!");
    }
</script>

</body>
</html>
