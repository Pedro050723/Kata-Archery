{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm p-4">
            <h3 class="text-primary fw-bold mb-3">Pagamento via Pix</h3>
            <p class="text-light mb-4">Escaneie o QR Code abaixo com o aplicativo do seu banco para confirmar a sua vaga de <strong>R$ 20,00</strong>.</p>
            
            <img src="data:image/png;base64,{{ qr_code_img }}" alt="QR Code Pix" class="img-fluid mb-4 rounded bg-white p-2" style="max-width: 250px;">
            
            <div class="mb-3 text-start">
                <label class="form-label text-light fw-bold small">Ou copie o código Pix (Copia e Cola):</label>
                <textarea class="form-control bg-dark text-light border-secondary mb-3" rows="3" readonly>{{ pix_copia_cola }}</textarea>
            </div>
            
            <div class="alert alert-warning border-warning text-dark small mb-0" role="alert">
                <strong>Atenção:</strong> Você tem 15 minutos para realizar o pagamento. Após esse tempo, a reserva será cancelada e a vaga liberada.
            </div>
        </div>
    </div>
</div>
{% endblock %}
